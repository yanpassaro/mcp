version: '3'

vars:
  DIST: dist
  GOOS: windows
  GOARCH: amd64
  CGO_ENABLED: '0'
  ANYDOC_TARGET: x86_64-pc-windows-gnu
  RUSTFLAGS: '-C target-feature=+crt-static'

env:
  GOOS: '{{.GOOS}}'
  GOARCH: '{{.GOARCH}}'
  CGO_ENABLED: '{{.CGO_ENABLED}}'

tasks:
  default:
    desc: Build all MCP servers (.exe) into dist/
    cmds:
      - task: build

  build:
    desc: Build all MCP servers
    deps: [prep]
    cmds:
      - task: build:git
      - task: build:github
      - task: build:sqlize
      - task: build:anydoc
      - task: build:sandbox
      - task: build:sandbox-cli

  build:git:
    desc: Build git-mcp.exe
    dir: git
    cmds:
      - go build -o ../{{.DIST}}/git-mcp.exe ./cmd/git-mcp

  build:github:
    desc: Build github-mcp.exe
    dir: github
    cmds:
      - go build -o ../{{.DIST}}/github-mcp.exe ./cmd/github-mcp

  build:sqlize:
    desc: Build sqlize-mcp.exe
    dir: sqlize
    cmds:
      - go build -o ../{{.DIST}}/sqlize-mcp.exe ./cmd/sqlize-mcp

  build:anydoc:
    desc: Build anydoc-mcp.exe into dist/ (Rust, cross-compiled for Windows)
    dir: anydoc
    deps: [prep]
    env:
      RUSTFLAGS: '{{.RUSTFLAGS}}'
    cmds:
      - cargo build --release --target {{.ANYDOC_TARGET}}
      - cmd: cp target\{{.ANYDOC_TARGET}}\release\anydoc-mcp.exe ../{{.DIST}}/anydoc-mcp.exe
        platforms: [linux, mac]
      - cmd: cp target/{{.ANYDOC_TARGET}}/release/anydoc-mcp.exe ../{{.DIST}}/anydoc-mcp.exe
        platforms: [windows]

  test:anydoc:
      desc: Run the anydoc test suite
      dir: anydoc
      cmds:
        - cargo test

  format:anydoc:
    desc: Format the anydoc module
    dir: anydoc
    cmds:
      - cargo fmt
      - cargo clippy --fix --allow-dirty

  build:sandbox:
    desc: Build sandbox-mcp.exe
    dir: sandbox
    cmds:
      - go build -o ../{{.DIST}}/sandbox-mcp.exe ./cmd/sandbox-mcp

  build:sandbox-cli:
    desc: Build sandbox.exe (CLI to run Lua scripts without the MCP)
    dir: sandbox
    cmds:
      - go build -o ../{{.DIST}}/sandbox.exe ./cmd/sandbox

  format:
    desc: Format all modules
    cmds:
      - task: format:git
      - task: format:github
      - task: format:sqlize
      - task: format:sandbox
      - task: format:anydoc

  format:git:
    desc: Format the git module
    dir: git
    cmds:
      - gofmt -w .
      - go mod tidy
      - go vet ./...

  format:github:
    desc: Format the github module
    dir: github
    cmds:
      - gofmt -w .
      - go mod tidy
      - go vet ./...

  format:sqlize:
    desc: Format the sqlize module
    dir: sqlize
    cmds:
      - gofmt -w .
      - go mod tidy
      - go vet ./...

  format:sandbox:
    desc: Format the sandbox module
    dir: sandbox
    cmds:
      - gofmt -w .
      - go mod tidy
      - go vet ./...

  clean:
    desc: Remove dist/
    cmds:
      - cmd: rm -rf {{.DIST}}
        ignore_error: true
      - cmd: powershell -NoProfile -Command "Remove-Item -Recurse -Force '{{.DIST}}'"
        ignore_error: true

  prep:
    desc: Create dist/
    internal: true
    cmds:
      - cmd: mkdir -p {{.DIST}}
        ignore_error: true
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.DIST}}'"
        ignore_error: true
