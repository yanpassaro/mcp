version: '3'

vars:
  DIST: dist
  GOOS: windows
  GOARCH: amd64
  CGO_ENABLED: '0'

env:
  GOOS: '{{.GOOS}}'
  GOARCH: '{{.GOARCH}}'
  CGO_ENABLED: '{{.CGO_ENABLED}}'

tasks:
  default:
    desc: Build all MCP servers (.exe) into dist/
    cmds:
      - task: build

  build:
    desc: Build all MCP servers
    deps: [prep]
    cmds:
      - task: build:git
      - task: build:github
      - task: build:sqlize
      - task: build:fetch
      - task: build:anydoc

  build:git:
    desc: Build git-mcp.exe
    dir: git
    cmds:
      - go build -o ../{{.DIST}}/git-mcp.exe ./cmd/git-mcp

  build:github:
    desc: Build github-mcp.exe
    dir: github
    cmds:
      - go build -o ../{{.DIST}}/github-mcp.exe ./cmd/github-mcp

  build:sqlize:
    desc: Build sqlize-mcp.exe
    dir: sqlize
    cmds:
      - go build -o ../{{.DIST}}/sqlize-mcp.exe ./cmd/sqlize-mcp

  build:anydoc:
    desc: Build anydoc.exe into dist/ (Deno)
    dir: anydoc
    deps: [prep]
    cmds:
      - deno task compile

  format:
    desc: Format all Go modules (gofmt -w, go mod tidy, go vet)
    cmds:
      - task: format:git
      - task: format:github
      - task: format:sqlize
      - task: format:fetch

  format:git:
    desc: Format the git module
    dir: git
    cmds:
      - gofmt -w .
      - go mod tidy
      - go vet ./...

  format:github:
    desc: Format the github module
    dir: github
    cmds:
      - gofmt -w .
      - go mod tidy
      - go vet ./...

  format:sqlize:
    desc: Format the sqlize module
    dir: sqlize
    cmds:
      - gofmt -w .
      - go mod tidy
      - go vet ./...

  format:fetch:
    desc: Format the fetch module
    dir: fetch
    cmds:
      - gofmt -w .
      - go mod tidy
      - go vet ./...

  build:fetch:
    desc: Build fetch-mcp.exe
    dir: fetch
    cmds:
      - go build -o ../{{.DIST}}/fetch-mcp.exe ./cmd/fetch-mcp

  clean:
    desc: Remove dist/
    cmds:
      - cmd: rm -rf {{.DIST}}
        ignore_error: true
      - cmd: powershell -NoProfile -Command "Remove-Item -Recurse -Force '{{.DIST}}'"
        ignore_error: true

  prep:
    desc: Create dist/
    internal: true
    cmds:
      - cmd: mkdir -p {{.DIST}}
        ignore_error: true
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.DIST}}'"
        ignore_error: true
