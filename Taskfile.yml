version: '3'

vars:
  DIST: dist
  GOOS: windows
  GOARCH: amd64
  CGO_ENABLED: '0'
  ANYDOC_TARGET: x86_64-pc-windows-gnu
  RUSTFLAGS: '-C target-feature=+crt-static'

env:
  GOOS: '{{.GOOS}}'
  GOARCH: '{{.GOARCH}}'
  CGO_ENABLED: '{{.CGO_ENABLED}}'

tasks:
  default:
    desc: Build all MCP servers (.exe) into dist/
    cmds:
      - task: build

  build:
    desc: Build all MCP servers
    deps: [prep]
    cmds:
      - task: build:git
      - task: build:github
      - task: build:docker
      - task: build:ssh
      - task: build:sqlize
      - task: build:sandbox

  build:linux:
    desc: Build all Go MCP servers for Linux (GOARCH defaults to amd64)
    deps: [prep]
    cmds:
      - task: build:git:linux
      - task: build:github:linux
      - task: build:docker:linux
      - task: build:ssh:linux
      - task: build:sqlize:linux
      - task: build:sandbox:linux

  build:git:
    desc: Build git-mcp.exe
    dir: git
    cmds:
      - go build -o ../{{.DIST}}/git-mcp.exe ./cmd/git-mcp

  build:git:linux:
    desc: Build git-mcp for Linux (GOARCH defaults to amd64)
    dir: git
    env:
      GOOS: linux
    cmds:
      - go build -o ../{{.DIST}}/git-mcp ./cmd/git-mcp

  build:github:
    desc: Build github-mcp.exe
    dir: github
    cmds:
      - go build -o ../{{.DIST}}/github-mcp.exe ./cmd/github-mcp

  build:github:linux:
    desc: Build github-mcp for Linux (GOARCH defaults to amd64)
    dir: github
    env:
      GOOS: linux
    cmds:
      - go build -o ../{{.DIST}}/github-mcp ./cmd/github-mcp

  build:docker:
    desc: Build docker-mcp.exe
    dir: docker
    cmds:
      - go mod tidy
      - go build -o ../{{.DIST}}/docker-mcp.exe ./cmd/docker-mcp

  build:docker:linux:
    desc: Build docker-mcp for Linux (GOARCH defaults to amd64)
    dir: docker
    env:
      GOOS: linux
    cmds:
      - go mod tidy
      - go build -o ../{{.DIST}}/docker-mcp ./cmd/docker-mcp

  build:ssh:
    desc: Build ssh-mcp.exe
    dir: ssh
    cmds:
      - go mod tidy
      - go build -o ../{{.DIST}}/ssh-mcp.exe ./cmd/ssh-mcp

  build:ssh:linux:
    desc: Build ssh-mcp for Linux (GOARCH defaults to amd64)
    dir: ssh
    env:
      GOOS: linux
    cmds:
      - go mod tidy
      - go build -o ../{{.DIST}}/ssh-mcp ./cmd/ssh-mcp

  build:sqlize:
    desc: Build sqlize-mcp.exe
    dir: sqlize
    cmds:
      - go build -o ../{{.DIST}}/sqlize-mcp.exe ./cmd/sqlize-mcp

  build:sqlize:linux:
    desc: Build sqlize-mcp for Linux (GOARCH defaults to amd64)
    dir: sqlize
    env:
      GOOS: linux
    cmds:
      - go build -o ../{{.DIST}}/sqlize-mcp ./cmd/sqlize-mcp

  build:anydoc:
    desc: Build anydoc-mcp.exe into dist/ (Rust, Windows x64 only)
    dir: anydoc
    deps: [prep]
    env:
      RUSTFLAGS: '{{.RUSTFLAGS}}'
    cmds:
      - cargo build --release --target {{.ANYDOC_TARGET}}
      - cp target/{{.ANYDOC_TARGET}}/release/anydoc-mcp.exe ../{{.DIST}}/anydoc-mcp.exe

  format:anydoc:
      desc: Format the anydoc module
      dir: anydoc
      cmds:
        - cargo fmt
        - cargo clippy --fix --allow-dirty

  build:sandbox:
    desc: Build sandbox-mcp.exe
    dir: sandbox
    cmds:
      - go build -o ../{{.DIST}}/sandbox-mcp.exe ./cmd/sandbox-mcp

  build:sandbox:linux:
    desc: Build sandbox-mcp for Linux (GOARCH defaults to amd64)
    dir: sandbox
    env:
      GOOS: linux
    cmds:
      - go build -o ../{{.DIST}}/sandbox-mcp ./cmd/sandbox-mcp

  format:
    desc: Format all modules
    cmds:
      - task: format:git
      - task: format:github
      - task: format:docker
      - task: format:ssh
      - task: format:sqlize
      - task: format:sandbox
      - task: format:anydoc

  format:git:
    desc: Format the git module
    dir: git
    cmds:
      - gofmt -w .
      - go mod tidy
      - go vet ./...

  format:github:
    desc: Format the github module
    dir: github
    cmds:
      - gofmt -w .
      - go mod tidy
      - go vet ./...

  format:docker:
    desc: Format the docker module
    dir: docker
    cmds:
      - gofmt -w .
      - go mod tidy
      - go vet ./...

  format:ssh:
    desc: Format the ssh module
    dir: ssh
    cmds:
      - gofmt -w .
      - go mod tidy
      - go vet ./...

  format:sqlize:
    desc: Format the sqlize module
    dir: sqlize
    cmds:
      - gofmt -w .
      - go mod tidy
      - go vet ./...

  format:sandbox:
    desc: Format the sandbox module
    dir: sandbox
    cmds:
      - gofmt -w .
      - go mod tidy
      - go vet ./...

  clean:
    desc: Remove dist/
    cmds:
      - cmd: rm -rf {{.DIST}}
        ignore_error: true
      - cmd: powershell -NoProfile -Command "Remove-Item -Recurse -Force '{{.DIST}}'"
        ignore_error: true

  prep:
    desc: Create dist/
    internal: true
    cmds:
      - cmd: mkdir -p {{.DIST}}
        ignore_error: true
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.DIST}}'"
        ignore_error: true
