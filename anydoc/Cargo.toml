[package]
name = "anydoc-mcp"
version = "1.0.0"
edition = "2021"
description = "MCP server that converts documents to Markdown and to PDF"
license = "MIT"

[[bin]]
name = "anydoc-mcp"
path = "src/main.rs"

[dependencies]
anydoc = "0.2"
rmcp = { version = "0.10", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
regex = "1"
csv = "1"
quick-xml = "0.41"

[profile.release]
lto = "thin"
strip = "symbols"
