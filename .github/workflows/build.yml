name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v1.0.0). Vazio = atualiza a release "latest".'
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: "Build (amd64)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Build MCP servers
        run: |
          mkdir -p dist
          task build:git build:github build:docker build:ssh build:sqlize build:sandbox build:sandbox-cli

      - name: List artifacts
        run: ls -lh dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp
          path: dist/

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="latest"
          fi

          if [ "$TAG" = "latest" ]; then
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest dist/*.exe dist/SHA256SUMS \
              --title "MCP servers — build mais recente" \
              --target "$GITHUB_SHA" \
              --notes "Build automático do commit \`$GITHUB_SHA\` — sem tag de versão."
          else
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/*.exe dist/SHA256SUMS --clobber
            else
              gh release create "$TAG" dist/*.exe dist/SHA256SUMS \
                --title "MCP servers $TAG" \
                --generate-notes
            fi
          fi
