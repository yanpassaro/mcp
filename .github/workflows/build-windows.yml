# Compila todos os servidores MCP para Windows (dist/*.exe) e publica os
# binários no GitHub Release, prontos para baixar.
#
# Triggers:
#   - push para main                     -> atualiza a release rolante "latest"
#                                            (sem precisar de tag; link fixo:
#                                            github.com/<repo>/releases/latest)
#   - push de tag "v*"                   -> cria/atualiza a release daquela tag
#   - workflow_dispatch (manual)         -> build sob demanda; input "tag"
#                                            opcional: informe uma tag para
#                                            lançar release versionada, ou
#                                            deixe vazio para atualizar "latest"

name: Build Windows

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v1.0.0). Vazio = atualiza a release "latest".'
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    name: "Build Windows (amd64)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Build all MCP servers
        run: task build

      - name: List artifacts
        run: ls -lh dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-windows
          path: dist/

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="latest"
          fi

          if [ "$TAG" = "latest" ]; then
            # Release rolante: apaga a anterior (release + tag) e recria
            # apontando para o commit atual. Link fixo:
            # https://github.com/yanpassaro/mcp/releases/latest
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest dist/*.exe dist/SHA256SUMS \
              --title "MCP servers — build mais recente" \
              --target "$GITHUB_SHA" \
              --notes "Build automático do commit \`$GITHUB_SHA\` — sem tag de versão."
          else
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/*.exe dist/SHA256SUMS --clobber
            else
              gh release create "$TAG" dist/*.exe dist/SHA256SUMS \
                --title "MCP servers $TAG" \
                --generate-notes
            fi
          fi
