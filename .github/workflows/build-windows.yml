name: Build Windows

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v1.0.0). Vazio = atualiza a release "latest".'
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    name: "Build Windows (amd64)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            anydoc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('anydoc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Test anydoc
        working-directory: anydoc
        run: cargo test

      - name: Build all MCP servers
        run: task build

      - name: List artifacts
        run: ls -lh dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-windows
          path: dist/

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="latest"
          fi

          if [ "$TAG" = "latest" ]; then
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest dist/*.exe dist/SHA256SUMS \
              --title "MCP servers — build mais recente" \
              --target "$GITHUB_SHA" \
              --notes "Build automático do commit \`$GITHUB_SHA\` — sem tag de versão."
          else
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/*.exe dist/SHA256SUMS --clobber
            else
              gh release create "$TAG" dist/*.exe dist/SHA256SUMS \
                --title "MCP servers $TAG" \
                --generate-notes
            fi
          fi
