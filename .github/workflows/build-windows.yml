name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v1.0.0). Vazio = só build, sem release.'
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    name: "Build Windows (amd64)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Build all MCP servers
        run: task build

      - name: List artifacts
        run: ls -lh dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-windows
          path: dist/

      - name: Create or update release
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.exe dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.exe dist/SHA256SUMS \
              --title "MCP servers $TAG" \
              --generate-notes
          fi
